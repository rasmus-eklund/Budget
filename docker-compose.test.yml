x-test-db-env: &test-db-env
  POSTGRES_DB: budget
  POSTGRES_PASSWORD: password
  POSTGRES_USER: postgres

services:
  test-db:
    image: postgres:16
    environment: *test-db-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  test-runner:
    image: oven/bun:1.3.14
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@test-db:5432/budget
      NODE_ENV: test
      SKIP_ENV_VALIDATION: "1"
      TEST_DATABASE_HOST: test-db
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_NAME: budget
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: password
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["bun", "test", "src/app/upload/actions/uploadActions.db.test.ts"]
